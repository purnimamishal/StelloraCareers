function renderCategories(){
  const bar=document.getElementById('categoriesBar');
  bar.innerHTML='';
  CATEGORIES.forEach(cat=>{
    const btn=document.createElement('button');
    btn.className='cat-btn'+(cat==='All'?' active':'');
    btn.textContent=cat==='All'?'All 101':cat;
    btn.onclick=()=>filterCategory(cat,btn);
    bar.appendChild(btn);
  });
}
let currentCategory='All';
function renderAll(){
  const grid=document.getElementById('careersGrid');
  grid.innerHTML='';
  CAREERS.forEach(c=>{
    const d=CAREER_DETAILS[c.id];
    if(!d) return;
    const div=document.createElement('div');
    div.className='career-card';
    div.dataset.category=c.category;
    div.dataset.id=c.id;
    div.onclick=()=>showDetails(c.id);
    div.innerHTML=`<span class="cat-label">${c.category}</span><h3>${c.id}. ${c.name}</h3><p style="font-size:13px;color:#666;">${d.eligibility}</p>`;
    grid.appendChild(div);
  });
  filterCareers();
}
function filterCategory(cat,btn){
  currentCategory=cat;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  filterCareers();
}
function filterCareers(){
  const q=document.getElementById('searchBox').value.toLowerCase();
  document.querySelectorAll('.career-card').forEach(card=>{
    const text=card.innerText.toLowerCase();
    const cat=card.dataset.category||'';
    const matchSearch=text.includes(q);
    const matchCat=currentCategory==='All'||cat===currentCategory;
    card.style.display=(matchSearch&&matchCat)?'block':'none';
  });
}
function showDetails(id){
  const data=CAREER_DETAILS[id];
  const career=CAREERS.find(c=>c.id===id);
  if(!data) return;
  document.getElementById('popup').innerHTML=`
  <div class="popup-box">
    <h2>${id}. ${career.name}</h2>
    <p><b>What:</b> ${data.what}</p>
    <p><b>Eligibility:</b> ${data.eligibility}</p>
    <p><b>Exams:</b> ${data.exams}</p>
    <p><b>Duration:</b> ${data.duration}</p>
    <p><b>Subjects:</b> ${data.subjects}</p>
    <p><b>Salary:</b> ${data.salary}</p>
    <p><b>Roadmap:</b> ${data.roadmap}</p>
    <div class="pros-cons">
      <div class="box box-green"><b>✅ Pros</b><br>${data.pros}</div>
      <div class="box box-red"><b>❌ Cons</b><br>${data.cons}</div>
    </div>
    <button onclick="closePopup()" style="margin-top:16px;padding:10px 20px;background:#2D1B4D;color:white;border-radius:8px;border:none;cursor:pointer;">Close</button>
  </div>`;
  document.getElementById('popup').style.display='block';
}
function closePopup(){document.getElementById('popup').style.display='none';}
document.addEventListener('DOMContentLoaded',()=>{
  renderCategories();
  renderAll();
  console.log("Total Careers:",Object.keys(CAREER_DETAILS).length);
  let missing=[];
  for(let i=1;i<=101;i++){if(!CAREER_DETAILS[i]?.pros||!CAREER_DETAILS[i]?.cons) missing.push(i);}
  if(missing.length===0) console.log("✅ All 101 have Pros/Cons DONE"); else console.log("❌ Missing:",missing);
});
</script>
